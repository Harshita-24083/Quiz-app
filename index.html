<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz app</title>
</head>
<style>
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #cont
    {
        border: 2px solid black;
        height: 400px;
        width: 500px;
        display: flex;
        flex-direction: column;
        border-radius: 14px;
        padding: 10px;
    }
    #nxt
    {
        width: 60px;
        background-color: rgb(0, 0, 255);
        color: azure;
       margin: 30px;
       height: 25px;
    }
    label{
        font-size: larger;
    }
    #scr
    {
        font-size: 20px;
    }
</style>
<body>
    <div id="cont">

        <h2 id="ques"></h2>
        <div id="option">
            <input type="radio" name="opt" value="0"><label id="op1"></label><br><br>
            <input type="radio"  name="opt" value="1"><label id="op2"></label><br><br>
            <input type="radio"  name="opt"value="2"><label id="op3"></label><br><br>
            <input type="radio" name="opt" value="3"><label id="op4"></label><br><br>
        </div>
        <button id="nxt">Next</button>
        <h3 id="scr"></h3>
       
    </div>
    <script src="new.js"></script>
</body>
</html>
